name: Deploy Indonesia Regulatory Landscape

on:
  workflow_dispatch:
  schedule:
    # 00:30 UTC = 08:30 Asia/Shanghai. GitHub scheduled workflows can run with delay.
    - cron: "30 0 * * *"
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh regulatory snapshot
        run: node work/update_regulatory_data.js github-actions

      - name: Build static site
        run: python work/build_indonesia_dashboard.py

      - name: Disable Jekyll
        run: touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
